name: Apply questionnaire correction
on:
  push:
    paths:
      - '.github/workflows/correct-questionnaire.yml'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply supplied questionnaire files
        run: |
          python3 - <<'PYTHON'
          import base64, io, zipfile, pathlib, hashlib
          r=pathlib.Path('.')
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.glob('participants/**/answer.txt')}
          assert len(before)==8328
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode('')))
          files={i.filename:z.read(i) for i in z.infolist() if not i.is_dir()}
          assert set(files)=={'README.md','questionnaire/scale.txt'}|{str(p) for p in r.glob('questionnaire/*/item.txt')}
          assert len(files)==25
          for name,data in files.items():
           assert '..' not in pathlib.PurePosixPath(name).parts
           pathlib.Path(name).write_bytes(data)
          assert before=={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.glob('participants/**/answer.txt')}
          assert not pathlib.Path('system').exists()
          print('Verified: 25 corrected files; 8328 participant answers unchanged.')
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md questionnaire
          git commit -m "Correct questionnaire wording and missing-value coding"
          git push
