name: Import materials
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
      - uses: actions/checkout@v4
        with:
          repository: chris82829/helena-questionnaire-data
          ref: 3867a9361e9e1fbd69dcbda53597645349f6368a
          path: source
          persist-credentials: false
      - name: Prepare materials
        shell: python
        run: |
          from pathlib import Path
          import shutil, re
          source, target = Path('source'), Path('target')
          for name in ('participants', 'questionnaire'):
              shutil.copytree(source/name, target/name)
          shutil.copyfile(source/'README.md', target/'README.md')
          files = [p for name in ('participants','questionnaire') for p in (target/name).rglob('*') if p.is_file()] + [target/'README.md']
          changed = replacements = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn('diana', 'HELENA', text, flags=re.I)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
                  replacements += count
          assert len(list((target/'participants').glob('*/condition/answer.txt'))) == 347
          assert len(list((target/'participants').glob('*/**/answer.txt'))) == 8328
          assert not (target/'system').exists()
          assert all(not re.search('diana', p.read_text(encoding='utf-8'), re.I) for p in files)
          print(f'{replacements} replacements in {changed} files; 347 participants; 8328 answers')
      - name: Save materials
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add participants questionnaire README.md
          git commit -m 'Add HELENA questionnaire and responses'
          git push origin HEAD:main
